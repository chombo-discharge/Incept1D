[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "incept1d"
# The version comes from the git tag (setuptools-scm); see [tool.setuptools_scm].
dynamic = ["version"]
description = "Discharge inception in a 1-D drift-reaction model: Paschen curves, growth rates and transport tables"
requires-python = ">=3.10"
authors = [{ name = "Robert Marskar" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSES/*.txt"]
dependencies = [
    "numpy>=1.25",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest", "pre-commit", "black", "flake8", "mpmath"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0"]

[project.scripts]
incept1d = "incept1d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Version from the latest release tag (v1.3.0 -> 1.3.0; later commits give e.g.
# 1.3.1.dev2+g4c9e587). Source archives without .git use .git_archival.txt.
[tool.setuptools_scm]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
  docs/build
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ holds the toy mechanism and closed_form.py, which the test modules
# import by name.
pythonpath = ["tests"]
markers = [
  "slow: loads real swarm data or runs the full solver (deselect with '-m \"not slow\"')",
]
filterwarnings = [
  "error::DeprecationWarning",
  # A stale apt mpl_toolkits shadows the pip matplotlib on some machines.
  "ignore:Unable to import Axes3D:UserWarning",
  # The solver evaluates det Q far outside the physical range on purpose.
  "ignore::RuntimeWarning",
]
