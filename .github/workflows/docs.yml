name: Deploy documentation

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages via OIDC (no branch, no stored credentials).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # conf.py records the commit id in the page footer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science \
            texlive-xetex \
            texlive-fonts-extra \
            fonts-dejavu \
            latexmk \
            poppler-utils
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[docs]

      - name: Restore computed example data
        uses: actions/cache@v4
        with:
          # The figures are computed from the solver, not committed.  Cache the
          # expensive part -- the inception curves -- keyed on everything that
          # can change them, so a docs-only change reuses them.
          path: |
            docs/build/figures/iec60052/sim_*.dat
            docs/build/figures/electra/sim.dat
          key: curves-${{ hashFiles('src/incept1d/**', 'mechanisms/**', 'examples/**/run.sh') }}

      - name: Build documentation figures
        working-directory: ${{ github.workspace }}/docs
        env:
          MPLBACKEND: Agg
        run: make figures

      - name: Build HTML documentation
        working-directory: ${{ github.workspace }}/docs
        env:
          MPLBACKEND: Agg
        run: make html

      # NOTE: `make latexpdf` currently produces a PDF containing only the
      # chapter headings -- the ``:hidden:`` toctrees in source/index.rst keep
      # the referenced documents out of the LaTeX doctree.  Add a PDF step here
      # once that is fixed.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    # Pull requests build the documentation but must not publish it.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
