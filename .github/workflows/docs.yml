# Build the documentation -- figures included -- and deploy it to GitHub Pages
# from the build artifact.
#
# The expensive step is computing the example curves with Inception.py
# (Docs/figures/Makefile -> Examples/*/run.sh).  Their outputs are cached,
# keyed on everything that can change the physics or the numerics, so a
# documentation-only change rebuilds in a couple of minutes while a solver
# change recomputes the curves.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # conf.py records the commit id

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib -r Docs/requirements.txt

      - name: Install TeX Live (pgfplots, siunitx) and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-pictures texlive-science \
            poppler-utils

      - name: Restore computed example curves
        id: curves
        uses: actions/cache@v4
        with:
          path: |
            Docs/build/figures/IEC60052/Sim_*.dat
            Docs/build/figures/Electra/Sim.dat
          key: curves-${{ hashFiles('Inception.py', 'FieldDistributions.py', 'Reactions.py', 'Constants.py', 'Air/**', 'Examples/**/run.sh') }}

      - name: Build figures
        env:
          MPLBACKEND: Agg
        run: make -C Docs figures

      - name: Build HTML
        run: make -C Docs html SPHINXOPTS="-W --keep-going"

      - name: Upload HTML artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Docs/build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
