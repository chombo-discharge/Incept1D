# REUSE (https://reuse.software) licensing manifest for Incept1D.
#
# Python sources carry inline SPDX headers.  Everything else is declared here,
# either because a comment header would be rendered by the consumer (.rst,
# .json, .css) or because the file is verbatim third-party data whose headers
# must not be touched.
#
# Later matches take precedence over earlier ones, so this file is ordered
# from the general project-wide defaults to the specific third-party data.

version = 1

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------

[[annotations]]
path = ["docs/**/*.rst", "docs/**/*.tex", "docs/**/*.css", "**/*.md"]
SPDX-FileCopyrightText = "2026 SINTEF Energy Research"
SPDX-License-Identifier = "GPL-3.0-or-later"

# ---------------------------------------------------------------------------
# Build system, CI and tooling configuration
# ---------------------------------------------------------------------------

[[annotations]]
path = [
  "docs/Makefile",
  "docs/figures/Makefile",
  "docs/make.bat",
  "docs/requirements.txt",
  "pyproject.toml",
  "**/*.yml",
  "**/*.yaml",
  "**/*.sh",
  ".flake8",
  ".gitignore",
  ".github/CODEOWNERS",
]
SPDX-FileCopyrightText = "2026 SINTEF Energy Research"
SPDX-License-Identifier = "GPL-3.0-or-later"

# ---------------------------------------------------------------------------
# Mechanism configurations (JSON): our own parameter sets
# ---------------------------------------------------------------------------

[[annotations]]
path = "mechanisms/**/*.json"
SPDX-FileCopyrightText = "2026 SINTEF Energy Research"
SPDX-License-Identifier = "GPL-3.0-or-later"

# ---------------------------------------------------------------------------
# Data generated by this repository's own code
#
# The zheleznyak_*.dat tables are produced by mechanisms/air/zheleznyak.py
# (see the "Command:" line in their headers) from the published analytic form
# of the Zheleznyak absorption function, so they are our own output.
# ---------------------------------------------------------------------------

[[annotations]]
path = "mechanisms/air/zheleznyak_*.dat"
SPDX-FileCopyrightText = "2026 SINTEF Energy Research"
SPDX-License-Identifier = "GPL-3.0-or-later"

